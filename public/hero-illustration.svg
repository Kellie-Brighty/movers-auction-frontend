<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Moving Truck -->
  <g transform="translate(60, 130) scale(0.15)">
    <rect x="10" y="180" width="580" height="220" rx="20" fill="#4144AF" />
    <rect x="10" y="280" width="580" height="120" rx="10" fill="#333F9E" />
    <rect x="590" y="200" width="250" height="200" rx="10" fill="#4144AF" />
    <rect x="590" y="200" width="250" height="40" rx="10" fill="#333F9E" />
    
    <!-- Windows -->
    <rect x="620" y="220" width="80" height="60" rx="5" fill="#A7C8FF" opacity="0.8" />
    <rect x="720" y="220" width="80" height="60" rx="5" fill="#A7C8FF" opacity="0.8" />
    
    <!-- Wheels -->
    <circle cx="180" cy="400" r="60" fill="#333" />
    <circle cx="180" cy="400" r="40" fill="#666" />
    <circle cx="180" cy="400" r="20" fill="#999" />
    
    <circle cx="440" cy="400" r="60" fill="#333" />
    <circle cx="440" cy="400" r="40" fill="#666" />
    <circle cx="440" cy="400" r="20" fill="#999" />
    
    <circle cx="700" cy="400" r="60" fill="#333" />
    <circle cx="700" cy="400" r="40" fill="#666" />
    <circle cx="700" cy="400" r="20" fill="#999" />
  </g>
  
  <!-- Moving Boxes -->
  <g>
    <!-- Box 1 -->
    <rect x="70" y="270" width="80" height="70" rx="5" fill="#FF7E1D" />
    <rect x="70" y="270" width="80" height="15" rx="3" fill="#EA6800" />
    <rect x="85" y="295" width="50" height="10" rx="2" fill="#FFEEDE" />
    
    <!-- Box 2 -->
    <rect x="170" y="240" width="100" height="100" rx="5" fill="#FF7E1D" />
    <rect x="170" y="240" width="100" height="20" rx="3" fill="#EA6800" />
    <rect x="190" y="280" width="60" height="10" rx="2" fill="#FFEEDE" />
    
    <!-- Box 3 -->
    <rect x="290" y="260" width="70" height="80" rx="5" fill="#4144AF" />
    <rect x="290" y="260" width="70" height="15" rx="3" fill="#333F9E" />
    <rect x="305" y="290" width="40" height="10" rx="2" fill="#EAEAFB" />
  </g>
  
  <!-- Person -->
  <g transform="translate(380, 250)">
    <!-- Head -->
    <circle cx="25" cy="25" r="20" fill="#FFD3B5" />
    
    <!-- Body -->
    <path d="M10 45 L40 45 L45 100 L5 100 Z" fill="#4144AF" />
    
    <!-- Arms -->
    <rect x="-10" y="50" width="20" height="60" rx="10" transform="rotate(-30 -10 50)" fill="#FFD3B5" />
    <rect x="60" y="50" width="20" height="60" rx="10" transform="rotate(30 60 50)" fill="#FFD3B5" />
    
    <!-- Legs -->
    <rect x="10" y="100" width="15" height="50" rx="5" fill="#001A5E" />
    <rect x="30" y="100" width="15" height="50" rx="5" fill="#001A5E" />
  </g>
  
  <!-- Price Tag -->
  <g transform="translate(330, 130)">
    <rect x="0" y="0" width="120" height="60" rx="10" fill="#FF7E1D" />
    <rect x="10" y="10" width="100" height="40" rx="5" fill="white" />
    <text x="30" y="35" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#FF7E1D">$$$</text>
    <circle cx="100" cy="10" r="15" fill="#4144AF" />
    <text x="93" y="16" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="white">%</text>
  </g>
  
  <!-- Road -->
  <rect x="0" y="350" width="500" height="50" fill="#333" />
  <rect x="20" y="370" width="40" height="10" fill="white" />
  <rect x="100" y="370" width="40" height="10" fill="white" />
  <rect x="180" y="370" width="40" height="10" fill="white" />
  <rect x="260" y="370" width="40" height="10" fill="white" />
  <rect x="340" y="370" width="40" height="10" fill="white" />
  <rect x="420" y="370" width="40" height="10" fill="white" />
</svg> 